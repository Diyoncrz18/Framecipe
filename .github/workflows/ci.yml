name: CI

# Phase 1 of docs/ci-cd-plan.md: fast checks on every push and pull request.
# No secrets, no render, no TTS or paid APIs. Windows runs too because the owner
# develops on Windows (CRLF checkout, temp paths with spaces in the tests).
# Actions are pinned to commit SHAs; the comment names the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - name: npm run build (zero warnings)
        run: |
          npm run build 2>&1 | tee build.log
          # A fresh runner has no .next/cache, so Next always prints "No build cache found" there; it is not a code warning.
          if grep -inE 'warn|⚠' build.log | grep -v 'No build cache found'; then
            echo "::error::next build printed a warning; AGENTS.md requires a warning-free build"
            exit 1
          fi

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run python -m py_compile tools/*.py
